<!--
  This page runs whenever someone opens a clean URL like
  divyanshimahajan.in/know-me directly (reload or shared link).
  GitHub Pages has no real file there, so it serves this page.
  We remember the path they wanted, then send them to the homepage,
  where the site opens that exact page — with a clean URL, no hashtag.
-->
<script>
  try {
    sessionStorage.setItem('spa_redirect', location.pathname + location.search);
  } catch (e) {}
  location.replace('/');
</script>
